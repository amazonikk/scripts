<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Knowledge Base - Login</title>
  <link rel="icon" type="image/png" href="/notipn.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: rgba(20, 24, 33, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-color: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-color: #10b981; /* Green */
      --accent-hover: #34d399; /* Light Green */
      --error-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: 50px; /* Lifted higher */
      overflow: hidden;
      position: relative;
    }

    /* Animated background gradients */
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(16, 185, 129, 0) 70%);
      top: -10%;
      left: -10%;
      z-index: 0;
      animation: float 20s infinite alternate;
    }

    .bg-glow-2 {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.08) 0%, rgba(52, 211, 153, 0) 70%);
      bottom: -15%;
      right: -10%;
      z-index: 0;
      animation: float 25s infinite alternate-reverse;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.1); }
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
      z-index: 1;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 30px 25px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 20px 50px rgba(16, 185, 129, 0.12);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-img {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
      margin-bottom: 15px;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #34d399 0%, #059669 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: var(--text-color);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      color: var(--text-color);
      outline: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .form-group input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      background: rgba(0, 0, 0, 0.4);
    }

    .password-container {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .toggle-password:hover {
      color: var(--text-color);
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-color) 0%, #047857 100%);
      color: var(--text-color);
      border: none;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
    }

    .btn:hover {
      background: linear-gradient(135deg, var(--accent-hover) 0%, var(--accent-color) 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
    }

    .btn:active {
      transform: translateY(1px);
    }

    /* Divider and Google Button */
    .divider {
      text-align: center;
      margin: 15px 0 10px 0;
      color: var(--text-muted);
      font-size: 14px;
      font-family: inherit;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 12px;
      color: #3c4043;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
      font-size: 15px;
    }

    .btn-google:hover {
      background-color: #f8f9fa;
      border-color: #d2e3fc;
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
      color: #202124;
    }

    .btn-google img {
      width: 18px;
      height: 18px;
    }

    /* Feedback messages */
    .message {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      font-weight: 500;
      animation: fadeIn 0.3s ease;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
      display: block;
    }

    .message.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--success-color);
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <div class="container">
    <div class="card">
      <div class="header">
        <img class="logo-img" src="/notipn.png" alt="Notion RAG Logo" onerror="this.style.display='none'">
        <div class="logo">Notion RAG</div>
        <div class="subtitle">Access the Knowledge Base</div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <div id="feedback-msg" class="message"></div>

      <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="manager@company.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-container">
            <input type="password" id="password" required placeholder="••••••••">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <div class="form-group" id="confirm-password-group" style="display: none;">
          <label for="confirm-password">Confirm Password</label>
          <div class="password-container">
            <input type="password" id="confirm-password" placeholder="••••••••">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirm-password', this)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn" id="submit-btn">Sign In</button>
      </form>


    </div>
  </div>

  <script>
    let currentMode = 'login';

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      
      if (isPassword) {
        btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
      } else {
        btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      }
    }

    function switchTab(mode) {
      currentMode = mode;
      document.getElementById('tab-login').classList.toggle('active', mode === 'login');
      document.getElementById('tab-register').classList.toggle('active', mode === 'register');
      document.getElementById('submit-btn').innerText = mode === 'login' ? 'Sign In' : 'Register Account';
      
      const confirmGroup = document.getElementById('confirm-password-group');
      const confirmInput = document.getElementById('confirm-password');
      
      if (mode === 'register') {
        confirmGroup.style.display = 'block';
        confirmInput.setAttribute('required', 'required');
      } else {
        confirmGroup.style.display = 'none';
        confirmInput.removeAttribute('required');
      }
      
      const msgBox = document.getElementById('feedback-msg');
      msgBox.className = 'message';
      msgBox.innerText = '';
    }

    async function handleAuth(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msgBox = document.getElementById('feedback-msg');
      
      msgBox.className = 'message';
      msgBox.innerText = '';

      if (currentMode === 'register') {
        const confirmPassword = document.getElementById('confirm-password').value;
        if (password !== confirmPassword) {
          msgBox.classList.add('error');
          msgBox.innerText = 'Passwords do not match.';
          return;
        }
      }

      const endpoint = currentMode === 'login' ? '/login' : '/register';
      
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          msgBox.classList.add('error');
          msgBox.innerText = data.error || 'Operation failed.';
          return;
        }
        
        if (currentMode === 'login') {
          msgBox.classList.add('success');
          msgBox.innerText = 'Success! Redirecting...';
          setTimeout(() => {
            window.location.href = '/';
          }, 800);
        } else {
          msgBox.classList.add('success');
          msgBox.innerText = 'Registration successful! You can now Sign In.';
          switchTab('login');
        }
      } catch (error) {
        msgBox.classList.add('error');
        msgBox.innerText = 'Network error. Please try again.';
      }
    }


  </script>
</body>
</html>
